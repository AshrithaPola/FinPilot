# Cloud Build for the frontend image (scripts/gcp_deploy.sh): the Firebase web
# config (public values) goes in as build args, which `gcloud builds submit --tag` can't pass.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, $_IMAGE,
           --build-arg, VITE_FIREBASE_API_KEY=$_FB_API_KEY,
           --build-arg, VITE_FIREBASE_AUTH_DOMAIN=$_FB_AUTH_DOMAIN,
           --build-arg, VITE_FIREBASE_PROJECT_ID=$_FB_PROJECT_ID,
           --build-arg, VITE_FIREBASE_APP_ID=$_FB_APP_ID, .]
images: [$_IMAGE]
